var volMap = {};
volumes.forEach(function(v){volMap[v.id]=v;});

// 构建控件
var ctrlDiv = document.getElementById('controls');
var allBtn = document.createElement('button');
allBtn.textContent='全部'; allBtn.className='active'; allBtn.onclick=function(){filterVol('all');};
ctrlDiv.appendChild(allBtn);
volumes.forEach(function(v){
var b=document.createElement('button');
b.textContent=v.name; b.dataset.vol=v.id;
b.onclick=function(){filterVol(v.id);};
ctrlDiv.appendChild(b);
});

// 图例
var legDiv = document.getElementById('legend');
volumes.forEach(function(v){
var s=document.createElement('span');
s.innerHTML='<i style="background:'+v.color+'"></i>'+v.name;
legDiv.appendChild(s);
});

var chart = echarts.init(document.getElementById('chart'));
var allNodes = nodes.map(function(n){return {name:n.name,value:n.size,symbolSize:n.size,
itemStyle:{color:volMap[n.vol].color},_vol:n.vol,_ch:n.ch,_desc:n.desc};});
var allLinks = links.map(function(l){return {source:l[0],target:l[1]};});

var option = {
tooltip:{show:false},
series:[{
type:'graph',layout:'force',roam:true,draggable:true,
data:allNodes,links:allLinks,
categories:volumes.map(function(v){return {name:v.name};}),
force:{repulsion:320,edgeLength:[60,140],gravity:0.08,layoutAnimation:true},
label:{show:true,position:'right',fontSize:11,color:'#1A1B1C'},
lineStyle:{color:'#C4C3BC',width:1,curveness:0.1,opacity:0.6},
emphasis:{focus:'adjacency',lineStyle:{width:2.5,opacity:1},
label:{fontSize:13,fontWeight:'bold'}},
edgeSymbol:['none','arrow'],edgeSymbolSize:6
}]
};
chart.setOption(option);

chart.on('click',function(p){
if(p.dataType!=='node')return;
var n=nodes.find(function(x){return x.name===p.data.name;});
if(!n)return;
var v=volMap[n.vol];
var related=links.filter(function(l){return l[0]===n.name||l[1]===n.name;})
.map(function(l){return l[0]===n.name?l[1]:l[0];});
document.getElementById('detail').innerHTML=
'<h3 style="color:'+v.color+'">'+n.name+'</h3>'+
'<div class="meta">'+v.name+' · '+n.ch+'</div>'+
'<div class="desc">'+n.desc+'</div>'+
'<div class="related">关联概念：'+related.join('、')+'</div>';
});

function filterVol(vol){
document.querySelectorAll('.controls button').forEach(function(b){
b.classList.toggle('active',vol==='all'?b.textContent==='全部':b.dataset.vol===vol);
});
var showNodes=new Set();
allNodes.forEach(function(n){
if(vol==='all'||n._vol===vol||n._vol==='core')showNodes.add(n.name);
});
// 核心节点始终显示，且显示与筛选节点相连的核心节点
var filteredNodes=allNodes.filter(function(n){return showNodes.has(n.name);});
var filteredLinks=allLinks.filter(function(l){
return showNodes.has(l.source)&&showNodes.has(l.target);
});
chart.setOption({series:[{data:filteredNodes,links:filteredLinks}]});
}

window.addEventListener('resize',function(){chart.resize();});
})();
