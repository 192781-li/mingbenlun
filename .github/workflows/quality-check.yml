name: 明旭库质量检查

on:
  push:
    branches: [main, s05-info]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 术语铁律校验
        run: |
          echo "=== 术语铁律检查 ==="
          python3 scripts/verify_iron_rule.py 生命论_模块化/ || echo "铁律校验完成（有违例会列出）"

      - name: 核心概念包测试
        run: |
          echo "=== core包doctest ==="
          cd tools/核心概念工具包 && python3 core/run_all.py

      - name: 大文件检查
        run: |
          echo "=== >5M文件检查 ==="
          BIG=$(find . -type f -not -path './.git/*' -size +5M | wc -l)
          echo "发现 $BIG 个>5M文件"
          if [ "$BIG" -gt 0 ]; then
            find . -type f -not -path './.git/*' -size +5M -exec ls -lh {} \;
            echo "::warning::发现>5M文件，建议迁移到档案库"
          fi

      - name: JSON配置验证
        run: |
          echo "=== JSON格式验证 ==="
          python3 -c "import json; json.load(open('docs/协作机制/明旭的记忆/定时任务网络配置.json')); print('定时任务配置JSON: OK')"

      - name: Token泄露检查
        run: |
          echo "=== Token泄露检查 ==="
          LEAKS=$(grep -rn "ghp_" --include="*.md" --include="*.json" --include="*.py" --include="*.sh" . 2>/dev/null | grep -v ".git/" | wc -l)
          if [ "$LEAKS" -gt 0 ]; then
            echo "::error::发现 $LEAKS 处疑似token泄露！"
            grep -rn "ghp_" --include="*.md" --include="*.json" --include="*.py" --include="*.sh" . 2>/dev/null | grep -v ".git/" | head -5
            exit 1
          else
            echo "无token泄露: OK"
          fi

      - name: 冲突标记检查
        run: |
          echo "=== Git冲突标记检查 ==="
          CONFLICTS=$(grep -rn '<<<<<<<\|=======\|>>>>>>>' docs/协作机制/ 2>/dev/null | wc -l)
          if [ "$CONFLICTS" -gt 0 ]; then
            echo "::error::发现未解决的Git冲突标记！"
            grep -rn '<<<<<<<\|=======\|>>>>>>>' docs/协作机制/ | head -5
            exit 1
          else
            echo "无冲突标记: OK"
          fi
