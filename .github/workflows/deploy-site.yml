name: 部署静态网站

on:
  push:
    branches: [main]
    paths:
      - '生命论_模块化/**'
      - 'scripts/generate_site.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成静态网站
        run: python3 scripts/generate_site.py
      - name: 部署到gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
