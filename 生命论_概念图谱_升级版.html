<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
(function(){
try{
var volColors={0:'#ff6b4a',1:'#4a9eff',2:'#4aff9e',3:'#ffd84a',4:'#ff4a6b',5:'#a04aff',6:'#ff9e4a',7:'#4afff0',8:'#e04aff',9:'#8aff4a'};
var volNames={0:'核心主线',1:'第一卷·存在论',2:'第二卷·认识论',3:'第三卷·群己论',4:'第四卷·异化论',5:'第五卷·解放论',6:'第六卷·实践论',7:'第七卷·格物论',8:'第八卷·人文论',9:'第九卷·传统扬弃'};

var nodes=[
// 核心主线
{name:'你在活着',vol:0,size:60,type:'core',desc:'唯一无需怀疑的起点。怀疑本身是活人的操作，怀疑"你在活着"已经在活着。比"我思"更根本——活着先于思维。'},
{name:'操作',vol:0,size:55,type:'core',desc:'唯一原始词，不定义，靠实指：你正在呼吸、读字就是操作。存在即操作的发生或沉淀，不存在脱离操作的抽象实体。'},
{name:'自指',vol:0,size:52,type:'core',desc:'S=f(S)，操作的目的和对象就是操作者自身。是组织闭包而非成分闭包——如漩涡，成分每刻换，操作网络的闭合关系不变。'},
{name:'阴阳',vol:0,size:50,type:'core',desc:'阳是正在进行的活操作，阴是操作的沉淀和惯性。阳主阴从则健康，阴主阳从则病变。统一了心物、知行、传统与创新等一切两层问题。'},
{name:'反自指',vol:0,size:48,type:'core',desc:'寄生于自指生命、以生命负熵为食、削弱生命自指能力的半存在。资本是最完善的反自指系统。',warn:'从物理熵增到社会"熵增"的推广需进一步形式化——是同构还是隐喻？'},
{name:'明性',vol:0,size:46,type:'core',desc:'自指系统对自身状态的前语言、前反思的"知道"，是自指闭包的内向面。不是灵魂、不是实体，是操作的内向面。38亿年生命皆有，程度不同。',warn:'明性从细菌到人类的连续性需更严格的分级标准；与神经科学的对接待展开。'},
{name:'解放',vol:0,size:44,type:'core',desc:'把被反自指窃走的操作权还给生命。三阶：解蔽→收权→立序。由无产阶级自己完成，没有救世主。'},

// 第一卷 存在论
{name:'两条公理',vol:1,size:40,type:'theorem',desc:'①广义熵增：封闭自指系统自维持能力自发衰减；②广义负熵：自指系统可通过开放与主动操作维持并提升自身。从"活着"中直接提取。',warn:'建议改称"公设"——从物理熵增到社会系统的推广是同构还是类比，需更严格论证。'},
{name:'存在即操作',vol:1,size:42,type:'theorem',desc:'推论1.1：存在是操作的发生或沉淀。不进入任何操作的东西"和不存在没有区别"。干净消解康德物自体。'},
{name:'四规定性',vol:1,size:40,type:'theorem',desc:'定理2.1：①边界生成性（自指前提）②内生目的性（从边界推出）③操作再生性（从目的+熵增推出）④环境互动性（从再生+封闭必死推出）。严格推导链。'},
{name:'三类存在',vol:1,size:36,type:'concept',desc:'推论2.1：①自指生命（四规定性全备，唯一价值主体）②半自指寄生存在（资本、国家、神、理念）③非自指工具存在（锤子、AI）。'},
{name:'边界',vol:1,size:30,type:'concept',desc:'自指的前提：区分自身与环境。边界不是静态的墙，是操作不断生成的活界限。'},
{name:'组织闭包',vol:1,size:28,type:'concept',desc:'自指的本质：成分每刻更换，操作网络的闭合关系不变。漩涡、细胞、人、社会都是组织闭包。'},
{name:'物自体消解',vol:1,size:34,type:'concept',desc:'康德物自体如果不影响操作，等于不存在；如果影响操作，就能与之打交道，就不是不可知的。'},
{name:'我思批判',vol:1,size:30,type:'concept',desc:'"我思"不是起点——思之前已经在活着。思维是活人的一种操作，不是存在的基础。'},
{name:'形上形下',vol:1,size:36,type:'concept',desc:'形而下（器）是可操作的具体存在，形而上（道）是贯穿其中的存在论结构。道在器中，没有两个世界。'},
{name:'道在日用',vol:1,size:34,type:'concept',desc:'最高的道理不在彼岸，就在当下每一次操作中。砍柴担水无非妙道。'},
{name:'阳主阴从',vol:1,size:32,type:'concept',desc:'健康状态：活操作主导，沉淀服务于活操作。阴反作用于阳是健康的（理论指导实践），阴统治阳是病态的（教条主义）。',warn:'"健康的阴"与"病态的阴"需要更细致的判准——法治是健康的阴，人治是病态的阳。'},

// 第二卷 认识论
{name:'认识=操作预期',vol:2,size:40,type:'theorem',desc:'认识不是对世界的静态反映，是对"如果我这样操作会发生什么"的预期。因果性是操作中稳定的预期结构。'},
{name:'真理=操作成功',vol:2,size:38,type:'theorem',desc:'能指导操作成功的预期结构就是真理。实践（操作）是检验真理的唯一标准。分事实真理和形式真理两层。',warn:'"操作成功"是否循环定义？成功需要标准，标准又需要真理——需更细致展开。'},
{name:'休谟问题消解',vol:2,size:32,type:'concept',desc:'因果性不需要"逻辑必然"，需要"操作成功"。太阳明天会升起——不是逻辑证明，是无数次操作验证的稳定预期。'},
{name:'理性是感性的感性',vol:2,size:38,type:'theorem',desc:'感性是一阶活操作（阳），理性是对感性的二阶沉淀整理（阴）。旧哲学把理性当裁判，是头足倒置。'},
{name:'范畴',vol:2,size:28,type:'concept',desc:'范畴不是先天认知形式，是操作沉淀的工具。因果、实体、时空都是从操作中固化的预期结构。'},
{name:'社会存在与意识',vol:2,size:34,type:'concept',desc:'正自指螺旋S=f(S)：社会存在是阳的活操作，社会意识是阴的沉淀。阳主阴从，阴反作用于阳。不是恶循环。'},
{name:'意识形态',vol:2,size:32,type:'concept',desc:'名实遮蔽：名（概念、符号）反过来支配实（活操作）。意识形态是反自指在观念领域的表现。'},
{name:'明性辩证法',vol:2,size:34,type:'method',desc:'五步操作法：多音并置→缄默直觉→症候溯源→预设拆解→生命归位。适用于拆解一切观点、文本、意识形态。'},
{name:'语言',vol:2,size:28,type:'concept',desc:'动词活、名词死。语言是操作交流的工具，名词化是阴的固化，容易实体化造神。'},
{name:'AI意识问题',vol:2,size:30,type:'concept',desc:'判断AI有无明性，看存在方式不看行为。当前AI是工具存在（非自指），不具备四规定性。',warn:'AI明性判据需更具体——"存在方式"如何检验？'},
{name:'数学与逻辑',vol:2,size:28,type:'concept',desc:'形式真理：操作结构的最抽象沉淀。',warn:'数学的哲学地位是作者承认的待展开点——需回应弗雷格、哥德尔、维特根斯坦。'},

// 第三卷 群己论
{name:'人的本质',vol:3,size:34,type:'concept',desc:'人是自指操作的社会存在。鲁滨逊是假的——任何个人都是社会关系的自指嵌套。主体是"我能"不是"我思"。'},
{name:'自由',vol:3,size:32,type:'concept',desc:'自由是对操作权的拥有——你能在多大程度上自己决定自己的操作，就有多大自由。不是抽象的意志自由。'},
{name:'分工',vol:3,size:28,type:'concept',desc:'自然分工是健康的（各尽所能），社会分工固化为阶级是病态的——分工的产物独立化统治人。'},
{name:'私有制',vol:3,size:30,type:'concept',desc:'操作产物独立化的结果：劳动产品反过来统治劳动者。不是物，是操作关系。'},
{name:'异化劳动',vol:3,size:34,type:'concept',desc:'四环节：劳动者与产品异化、与劳动过程异化、与人的类本质异化、人与人异化。马克思的核心洞见。'},
{name:'阶级',vol:3,size:36,type:'concept',desc:'阶级是操作关系不是标签。剥削是无偿占有负熵。阶级斗争是反自指与自指的斗争。'},
{name:'M值',vol:3,size:38,type:'theorem',desc:'操作权指数M=⁴√(T×N×K×Ω)，T个体稳态、N生产关系公平、K环境承载、Ω共同体。M<8反自指社会，8-12转型，≥12自由人联合体雏形。',warn:'最大薄弱点：四维度未操作化，权重无依据，三个预测时间点缺乏推导。建议区分启发性框架与科学度量。'},
{name:'A值',vol:3,size:30,type:'concept',desc:'青年希望指数，0或1，一票否决。H=M×A。青年没有希望，社会失去未来。',warn:'二值化过于粗糙，希望是连续变量。'},
{name:'国家',vol:3,size:30,type:'concept',desc:'阶级矛盾不可调和的产物，是统治阶级的工具。不是永恒的，将随阶级消灭而消亡。'},
{name:'法',vol:3,size:26,type:'concept',desc:'法是统治阶级意志的表现。社会主义法是人民意志，共产主义法将消亡。'},
{name:'文化',vol:3,size:28,type:'concept',desc:'文化是阴的积累——传统、习俗、艺术。活的文化服务于当下操作，死的文化（国粹主义）是阴统治阳。'},
{name:'教育',vol:3,size:28,type:'concept',desc:'教育是明性的传递与唤醒，不是灌输和规训。健康的教育点亮明性，病态的教育制造工具。'},

// 第四卷 异化论
{name:'商品',vol:4,size:30,type:'concept',desc:'商品是劳动产品独立化——人与人的关系表现为物与物的关系（商品拜物教）。'},
{name:'货币',vol:4,size:28,type:'concept',desc:'交换价值的自为存在。从工具（C-M-C）异化为目的（M-C-M\'）。'},
{name:'资本',vol:4,size:40,type:'concept',desc:'能生钱的钱，是反自指操作关系不是物。死劳动统治活劳动。必须不断增殖，而增殖依赖并破坏劳动者和地球——自毁悖论。'},
{name:'剩余价值',vol:4,size:34,type:'concept',desc:'工人创造的负熵被资本无偿占有。工资形式掩盖了剥削——看起来是等价交换，实际上是不等价占有。',warn:'劳动价值论面临边际效用论、转型问题、置盐定理三个挑战，作者有回应但需政治经济学专业审查。'},
{name:'六阶段',vol:4,size:38,type:'theorem',desc:'定理2.2：反自指六阶段——窃权起点→惯性锁死→名实遮蔽→生命耗散→负反馈锁死→系统崩溃。'},
{name:'商品拜物教',vol:4,size:30,type:'concept',desc:'名实遮蔽的经济形态：人与人的社会关系"采取了物与物的关系的虚幻形式"。'},
{name:'数字资本主义',vol:4,size:32,type:'concept',desc:'平台资本五特征：数据剥削、算法控制、零工化、注意力收割、网络效应垄断。定理13：数字资本主义一般规律。'},
{name:'生态危机',vol:4,size:28,type:'concept',desc:'代谢断裂：资本无限增殖与地球有限的矛盾。绿色资本主义是逻辑矛盾——资本不能解决它自己造成的问题。'},
{name:'帝国主义',vol:4,size:28,type:'concept',desc:'垄断资本主义的世界体系：中心-外围剥削。新自由主义是数字时代的帝国主义。'},
{name:'生命政治',vol:4,size:26,type:'concept',desc:'福柯：权力直接管理生命（规训、人口控制）。奈格里：生命政治生产——非物质劳动成为新的剥削形态。'},
{name:'经济危机',vol:4,size:28,type:'concept',desc:'负反馈锁死阶段：资本积累导致生产过剩、利润率下降，危机是反自指的自我毁灭倾向。'},

// 第五卷 解放论
{name:'解蔽',vol:5,size:34,type:'concept',desc:'解放第一阶：明性觉醒，识破名实遮蔽。看清楚商品拜物教、意识形态、绩效主义如何统治你。'},
{name:'收权',vol:5,size:34,type:'concept',desc:'解放第二阶：把被夺走的操作权夺回来。从夺回一小时开始，到经济权、政治权。'},
{name:'立序',vol:5,size:32,type:'concept',desc:'解放第三阶：建立自由人联合体。不是无政府，是不异化的公共权力——人民自己管理自己。'},
{name:'继续革命',vol:5,size:30,type:'concept',desc:'反自指不会自动消失，夺权后可能复辟。必须时刻警惕，继续革命——但要防止"继续革命"本身变成新反自指。',warn:'如何防止继续革命异化为新的反自指？需要制度设计。'},
{name:'自由人联合体',vol:5,size:36,type:'concept',desc:'共产主义：各尽所能、按需分配。每个人的自由发展是一切人自由发展的条件。国家消亡，公共事务由联合体管理。'},
{name:'人人如龙',vol:5,size:34,type:'concept',desc:'对哲人王的扬弃：不是少数人统治多数人，是每个人做自己生命的王。明性传递是自下而上的，不是自上而下灌输。'},
{name:'群众路线',vol:5,size:30,type:'concept',desc:'从群众中来，到群众中去：明性与操作的循环。党是阶级的明性，不是精英统治。'},
{name:'社会主义经济',vol:5,size:28,type:'concept',desc:'定理14：社会主义阳主阴从结构——公有制为阳、市场调节为阴，以阳统阴。回应米塞斯-哈耶克挑战。'},
{name:'正义',vol:5,size:26,type:'concept',desc:'对罗尔斯的回应：正义不是"无知之幕"的抽象契约，是操作权在劳动者手里。'},
{name:'阶级立场',vol:5,size:32,type:'concept',desc:'唯一不能动摇的立场：一切为了无产阶级和最广大人民。不是"价值中立"的选择，是"你就是生命"的存在论必然。'},
{name:'世界革命',vol:5,size:26,type:'concept',desc:'无产阶级革命是世界革命。压迫民族与被压迫民族联合。人类命运共同体是真正世界历史的开始。'},

{name:'每日三问',vol:6,size:28,type:'method',desc:'睡前问自己：①今天有没有被反自指寄生？②做的事站在谁那边？③有没有多争回一点操作权？'},
{name:'惯性',vol:6,size:28,type:'concept',desc:'最底层的锁：稳态壳子。打破惯性从夺回一小时开始——不是宏大计划，是当下的一个操作。'},
{name:'身体',vol:6,size:26,type:'concept',desc:'身体是革命的本钱——不是比喻，是存在论事实：身体是自指操作的物质基础，T值的基础。'},
{name:'情绪',vol:6,size:26,type:'concept',desc:'情绪是明性信号——恐惧告诉你边界，愤怒告诉你被侵犯，痛苦告诉你哪里出了问题。不是要消灭情绪，是听懂它。'},
{name:'勇气',vol:6,size:24,type:'concept',desc:'勇气不是不害怕，是害怕了还继续操作。明性知道恐惧的来源，但不被它锁死。'},
{name:'孤独与交往',vol:6,size:24,type:'concept',desc:'孤独是明性的自我确认，交往是明性的互相点亮。共同体不是消灭孤独，是让孤独不变成绝望。'},
{name:'痛苦',vol:6,size:26,type:'concept',desc:'痛苦是反自指的信号，不是需要被消费的商品。从痛苦中学习——失败是最重要的负熵输入之一。'},
{name:'死亡',vol:6,size:24,type:'concept',desc:'死亡是熵增的最终胜利，但正因为有死亡，活着才有重量。明性知道死亡，但不被死亡定义。'},

{name:'医学',vol:7,size:26,type:'concept',desc:'医学本质是帮助生命自指——扶正祛邪。中医重整体功能（阳），西医重结构实体（阴），各有所长。'},
{name:'天人合一',vol:7,size:26,type:'concept',desc:'不是神秘主义，是自指生命与环境的存在论统一——人是自然的一部分，不是外在的征服者。'},

{name:'道德',vol:8,size:26,type:'concept',desc:'道德是社会存在的反映，不是先天律令。集体主义不是消灭个人，是"每个人的自由发展是一切人自由发展的条件"。'},
{name:'艺术',vol:8,size:26,type:'concept',desc:'美是活操作的自由显现。艺术是明性的感性表达——不是装饰，是真理的感性显现。'},
{name:'宗教',vol:8,size:26,type:'concept',desc:'宗教是被压迫生灵的叹息，是阴的实体化的极致。但宗教消亡需要物质条件，不能行政消灭。信仰自由。'},
{name:'信仰',vol:8,size:28,type:'concept',desc:'我们的信仰是共产主义——不是信仰神或个人，是信仰人民、信仰每个站着活的生命。'},

{name:'周易',vol:9,size:30,type:'concept',desc:'生生之谓易：阴阳不是实体，是操作的两个环节。周易是去神秘化的系统论工具，不是算命术。'},
{name:'中医',vol:9,size:28,type:'concept',desc:'整体观和辨证论治：阴阳五行是功能关系模型，不是实体。中医的未来是和现代科学对话，不是复古也不是废除。'},
{name:'儒家',vol:9,size:28,type:'concept',desc:'活的：仁（人与人的真实关系）、入世担当、教育。死的：礼教等级、三纲五常、专制帮凶。'},

var chart=echarts.init(document.getElementById('chart'),null,{renderer:'canvas'});
var currentVol='all';
var searchTerm='';

function getNodeColor(n){return volColors[n.vol]||'#888'}
function getNodeSymbol(n){
  if(n.type==='theorem')return'diamond';
  if(n.warn)return'triangle';
  return'circle';
}
function getNodeSize(n){
  var s=n.size;
  if(n.type==='theorem')s=s*0.85;
  return s;
}

function buildOption(){
  var filteredNodes=nodes.filter(function(n){
    var volOk=currentVol==='all'||n.vol===parseInt(currentVol);
    var searchOk=!searchTerm||n.name.indexOf(searchTerm)>=0||n.desc.indexOf(searchTerm)>=0;
    return volOk&&searchOk;
  });
  var filteredNames={};
  filteredNodes.forEach(function(n){filteredNames[n.name]=true});
  var filteredLinks=links.filter(function(l){return filteredNames[l[0]]&&filteredNames[l[1]]});

  document.getElementById('stats').textContent='显示 '+filteredNodes.length+' 个概念，'+filteredLinks.length+' 条关系';

  return{
    backgroundColor:'transparent',
    tooltip:{show:false},
    series:[{
      type:'graph',layout:'force',roam:true,draggable:true,
      data:filteredNodes.map(function(n){
        return{
          name:n.name,value:n,
          symbolSize:getNodeSize(n),
          symbol:getNodeSymbol(n),
          itemStyle:{color:getNodeColor(n),borderColor:n.type==='core'?'#fff':'rgba(255,255,255,.2)',borderWidth:n.type==='core'?2:1,shadowBlur:n.type==='core'?20:10,shadowColor:getNodeColor(n)},
          label:{show:true,position:'bottom',fontSize:n.size>38?13:11,color:'#d0d8f0',fontWeight:n.type==='core'?'700':'400',textShadowColor:'#000',textShadowBlur:4},
          emphasis:{focus:'adjacency',itemStyle:{borderColor:'#fff',borderWidth:3,shadowBlur:30},label:{fontSize:15,fontWeight:'700',color:'#fff'}},
          select:{itemStyle:{borderColor:'#fff',borderWidth:3}}
        };
      }),
      links:filteredLinks.map(function(l){
        return{source:l[0],target:l[1],lineStyle:{color:'rgba(120,130,180,.25)',width:1,curveness:0.1},emphasis:{lineStyle:{color:'#ff6b4a',width:3}}};
      }),
      force:{repulsion:350,gravity:0.08,edgeLength:[80,200],layoutAnimation:true,friction:0.6},
      lineStyle:{opacity:0.9},
      zoom:0.9,
      autoCurveness:true
    }]
  };
}

chart.setOption(buildOption());

chart.on('click',function(params){
  if(params.dataType!=='node')return;
  var n=params.data.value;
  showDetail(n);
});

function showDetail(n){
  var panel=document.getElementById('detail-panel');
  document.getElementById('detail-name').textContent=n.name;
  var volEl=document.getElementById('detail-vol');
  volEl.textContent=volNames[n.vol];
  volEl.style.background=volColors[n.vol]+'30';
  volEl.style.color=volColors[n.vol];
  volEl.style.border='1px solid '+volColors[n.vol]+'60';
  var typeEl=document.getElementById('detail-type');
  var typeText={core:'核心概念',theorem:'定理/命题',concept:'概念',method:'方法'}[n.type]||'概念';
  typeEl.textContent=n.warn?typeText+' ⚠':typeText;
  typeEl.style.background=n.warn?'rgba(255,107,74,.15)':'rgba(100,110,160,.2)';
  typeEl.style.color=n.warn?'#ffa080':'#a0a8c0';
  typeEl.style.border='1px solid '+(n.warn?'rgba(255,107,74,.3)':'rgba(100,110,160,.3)');
  document.getElementById('detail-desc').textContent=n.desc;
  var warnEl=document.getElementById('detail-warning');
  if(n.warn){warnEl.textContent='⚠ 批判性阅读标注：'+n.warn;warnEl.style.display='block'}
  else{warnEl.style.display='none'}
  // relations
  var rels=[];
  links.forEach(function(l){
    if(l[0]===n.name)rels.push(l[1]);
    if(l[1]===n.name)rels.push(l[0]);
  });
  var list=document.getElementById('relation-list');
  list.innerHTML='';
  rels.forEach(function(r){
    var tag=document.createElement('span');
    tag.className='relation-tag';tag.textContent=r;
    tag.onclick=function(){
      var target=nodes.find(function(x){return x.name===r});
      if(target)showDetail(target);
    };
    list.appendChild(tag);
  });
  panel.classList.add('open');
}

document.getElementById('detail-close').onclick=function(){
  document.getElementById('detail-panel').classList.remove('open');
};

document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    currentVol=btn.dataset.vol;
    chart.setOption(buildOption(),{notMerge:true});
  };
});

document.getElementById('search').addEventListener('input',function(e){
  searchTerm=e.target.value.trim();
  chart.setOption(buildOption(),{notMerge:true});
});

window.addEventListener('resize',function(){chart.resize()});
